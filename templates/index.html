<!DOCTYPE html>
<html>
<head>

    <title>Secure Steganography Tool</title>

    <style>

        body{
            font-family: Arial;
            background:#0f172a;
            color:white;
            text-align:center;
            padding:40px;
        }

        .container{
            width:500px;
            margin:auto;
            background:#1e293b;
            padding:30px;
            border-radius:15px;
        }

        textarea{
            width:90%;
            padding:10px;
        }

        input{
            margin:10px;
        }

        button{
            padding:10px 20px;
            border:none;
            background:#38bdf8;
            color:black;
            font-weight:bold;
            border-radius:8px;
            cursor:pointer;
        }

        button:hover{
            background:#0ea5e9;
        }

        hr{
            margin:30px 0;
        }

    </style>

</head>

<body>

<div class="container">

<h1>Secure Image Steganography Tool</h1>

<p>
Hide confidential messages inside images securely
</p>

<hr>

<h2>Encode Message</h2>

<form action="/encode" method="post" enctype="multipart/form-data">

    <input type="file" name="image" required>

    <br><br>

    <textarea
        name="message"
        rows="5"
        placeholder="Enter secret message"
        required></textarea>

    <br><br>

    <button type="submit">
        Encode Message
    </button>

</form>

<hr>

<h2>Decode Message</h2>

<form action="/decode" method="post" enctype="multipart/form-data">

    <input type="file" name="image" required>

    <br><br>

    <button type="submit">
        Decode Message
    </button>

</form>

</div>

</body>
</html>
